; Кампания для Security Quest. Формат описан в docs\campaign-format.md.
; Файл в кодировке UTF-8. Строки, начинающиеся с «;», — комментарии.
;
; Чтобы добавить кампанию: положите файл *.ini в папку campaigns рядом с программой
; или в data\campaigns и нажмите «Перечитать» на странице «Кампания».
;
; Важно: не меняйте id кампании и id рубежей после того, как начали её проходить, —
; по ним хранится прогресс. Тексты, силу врагов и награды менять можно.

[campaign]
id = north-march
title = Тени Северной Марки
author = Security Quest
description = Три главы на севере: снежные тропы, курганы драугров и Ледяной престол. Для героя 3-го уровня и выше.
prologue = С севера перестали приходить обозы. Последний гонец из Северной Марки успел сказать одно слово — «зима» — и умер у ворот Цитадели. Хранитель собирает отряд и уходит за перевал.
epilogue = Ледяной ярл пал, и над Маркой впервые за год взошло солнце. Обозы снова идут на юг, а в каждом северном доме знают имя Хранителя.

[chapter.1]
name = Застава у Перевала
intro = Перевал замело, и в снегу хозяйничают волки и разбойники. Застава держится из последних сил.
color = 170, 200, 230

[chapter.2]
name = Курганы драугров
intro = За перевалом поднялись из курганов драугры — мёртвые воины старых конунгов.
color = 140, 170, 150

[chapter.3]
name = Ледяной престол
intro = В сердце ледника сидит Ледяной ярл. Его лёд не берёт сталь — только огонь.
color = 120, 200, 255

; Враг: имя; количество; здоровье; атака; защита; урон; скорость; признаки
;   урон — число или диапазон «мин-макс»; признаки (необязательно): стрелок, босс

[frontier.1.1]
chapter = 1
name = Снежная тропа
intro = Тропу к заставе стерегут снежные волки. Быстрые и голодные.
victory = Волки разбежались. Застава видит дым наших костров.
level = 3
gold = 120
enemy1 = Снежный волк; 14; 14; 6; 3; 2-5; 8

[frontier.1.2]
chapter = 1
name = Ночной налёт
intro = Разбойники ударили по заставе ночью. Держим стены, пока лучники бьют сверху.
victory = Налёт отбит. Пленные рассказали, кто их нанял.
level = 4
walls = 1
defense = да
gold = 160
enemy1 = Разбойник-северянин; 18; 12; 6; 4; 2-4; 5
enemy2 = Лучник-налётчик; 10; 9; 6; 2; 2-4; 5; стрелок

[frontier.1.3]
chapter = 1
name = Пещера изгнанника
intro = Разбойников вёл Йотун-изгнанник. Его шкуру не пробить без выкованного оружия.
victory = Йотун повержен. Дорога за перевал открыта.
level = 4
weapon = 1
gold = 220
enemy1 = Йотун-изгнанник; 1; 260; 11; 9; 14-20; 4; босс
enemy2 = Снежный волк; 12; 14; 6; 3; 2-5; 8

[frontier.2.1]
chapter = 2
name = Старая гать
intro = Драугры бьют ржавыми клинками, но в мёрзлой топи раны гниют. Без брони не пройти.
victory = Гать за нами, драугры отступили к курганам.
level = 5
armor = 1
gold = 200
enemy1 = Драугр; 22; 20; 8; 7; 3-6; 4

[frontier.2.2]
chapter = 2
name = Тризна мертвецов
intro = Мёртвые справляют тризну по живым. Курганные духи бьют сквозь кольчугу.
victory = Тризна оборвана. Курганные духи вернулись в землю.
level = 6
armor = 2
gold = 260
